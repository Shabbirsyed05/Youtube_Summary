<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brain Library</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 680px;
    }

    header {
      margin-bottom: 28px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    p.subtitle {
      color: var(--text-sub);
      font-size: 0.95rem;
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      display: block;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease-in-out;
    }

    .card:hover {
      background: var(--card-hover);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--accent);
      line-height: 1.4;
      margin-bottom: 4px;
    }

    .card-meta {
      font-size: 0.85rem;
      color: var(--text-sub);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Brain Library</h1>
      <p class="subtitle">Select an article to view the notes</p>
    </header>

    <div class="card-list">
      <a class="card" href="brain/Andrew%20Huberman%3A%20Become%20Mentally%20Dangerous%20With%20These%20Daily%20Habits.html" target="_blank">
        <div class="card-title">Andrew Huberman: Become Mentally Dangerous With These Daily Habits</div>
        <div class="card-meta">Daily routines, focus, and neurobiology</div>
      </a>

      <a class="card" href="brain/Neuroscientist's%20Guide%20To%2010X%20Your%20Focus%20%26%20Memory%20%7C%20Dr%20Sahar%20Yousef.html" target="_blank">
        <div class="card-title">Neuroscientist's Guide To 10X Your Focus &amp; Memory | Dr Sahar Yousef</div>
        <div class="card-meta">Cognitive productivity and memory enhancement</div>
      </a>
    </div>
  </div>

</body>
</html>
